# Example: a DIIVOO WG03 gateway. Valves are paired at run time; the
# component creates their entities itself and shows each model's zones.
#
# This file builds the component from this repository's checkout (CI does
# exactly that). In your own config, take the component from GitHub instead:
#
#   external_components:
#     - source: github://arctus/esphome-diivoo@v1.1.0
#       components: [diivoo]

substitutions:
  device_name: diivoo-gateway
  friendly_name: Garden Irrigation

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # make_entity_preference() arrived in 2026.7.
  min_version: 2026.7.0

esp32:
  board: esp32dev
  # The WG03's 3.3 V rail sags at Wi-Fi start-up and browns the board out.
  # 160 MHz, low TX power (below) and no brownout reset ride through it.
  cpu_frequency: 160MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_BROWNOUT_DET: n

external_components:
  - source:
      type: local
      path: ../components
    components: [diivoo]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: ha_time

# Gateway LED (active low). ESPHome uses it for errors and warnings, and it
# blinks while pairing mode is on.
light:
  - platform: status_led
    id: gateway_led
    name: Gateway LED
    internal: true
    pin:
      number: GPIO14
      inverted: true
    effects:
      - strobe:
          name: Pairing
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 250ms

# WG03 radio wiring.
diivoo:
  id: gateway
  sclk_pin: GPIO27
  sdio_pin: GPIO19
  csb_pin: GPIO25
  fcsb_pin: GPIO26
  power_pin:
    number: GPIO21
    inverted: true # LOW powers the radio
  irq_pin:
    number: GPIO18
    mode:
      input: true
      pulldown: true
  # Pick any non-zero 32-bit number and keep it: valves pair to this id.
  # Omit it to derive one from the ESP32's MAC (lost if the board changes).
  hub_id: 0x12345678
  time_id: ha_time
  pairing_timeout: 5min
  max_valves: 4
  pairing_light: gateway_led
  pairing_effect: Pairing

binary_sensor:
  # The gateway's button toggles pairing mode.
  - platform: gpio
    id: gateway_button
    pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - lambda: id(gateway).toggle_pairing_mode();
